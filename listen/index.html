<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b35"><title>Santa's Ghellings Workshop — Gellings</title>
<style>
:root{--navy:#071b35;--teal:#20c9c2;--gold:#e7c45d;--cream:#fff8e9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#173e61,var(--navy) 68%);color:var(--cream);font-family:Arial,sans-serif}main{max-width:980px;width:calc(100% - 28px);margin:auto;padding:24px 0 40px;text-align:center}.brand{font-size:clamp(32px,6vw,50px);font-weight:900;color:var(--teal)}.tag{margin:0 0 20px}.player{margin:20px auto;padding:22px;max-width:680px;background:#102b49;border:1px solid #2b5679;border-radius:15px}h1{font-size:clamp(23px,4vw,34px);margin:0 0 8px}p{line-height:1.5}button{border:0;border-radius:999px;padding:15px 26px;background:linear-gradient(135deg,#80c342,#b5df6d);color:#09213a;font-size:16px;font-weight:900;cursor:pointer}audio{display:block;width:100%;margin-top:15px}.scene{width:100%;aspect-ratio:16/9;object-fit:cover;border:3px solid var(--gold);border-radius:12px}.caption{font-size:clamp(18px,3vw,24px);font-weight:800;margin:12px}.small{font-size:12px;color:#bfd0df}footer{margin-top:24px;color:#d5e3ed;font-size:13px}
</style></head><body><main><div class="brand">Gellings</div><div class="tag">The Happy Hygiene &amp; Hospitality People</div>
<section class="player"><h1>🎄 Santa's Ghellings Workshop 🎸</h1><p>You're in! Press play and watch the Christmas scenes follow the song.</p><button id="play">▶ PLAY THE CHRISTMAS SONG</button><audio id="audio" controls preload="metadata"><source src="../christmas-song/Gellings-Christmas-Song-Full-Site/assets/santas-ghellings-workshop.mp3" type="audio/mpeg"></audio><p class="small">The full song is 2 minutes 2 seconds. Your phone may need the volume turned up.</p></section>
<img id="scene" class="scene" alt="Gellings Christmas song scene"><div id="caption" class="caption"></div><div id="number" class="small"></div>
<footer>Merry Christmas from everyone at Gellings ❤️</footer></main>
<script>
const base='../christmas-song/Gellings-Christmas-Song-Full-Site/assets/';
const files=['01-north-pole-breaking-news.jpg','02-santa-calls-gellings.jpg','03-office-and-orders-chaos.jpg','04-dave-and-daz-island-deliveries.jpg','05-john-parking-problem.jpg','06-colin-and-the-mince-pies.jpg','07-glynis-clocked-off.jpg','08-gellings-team-chorus.jpg','09-grand-christmas-finale.jpg'];
const captions=['Breaking news from the North Pole!','Santa calls Gellings for help','Orders, presents and paperwork everywhere','Dave and Daz race round the island','John has nowhere left to park','Colin has found the mince pies','Glynis has clocked off for Christmas Eve','The Gellings team bring the chorus','Santa is sorted — Merry Christmas!'];
const audio=document.getElementById('audio'),img=document.getElementById('scene'),cap=document.getElementById('caption'),num=document.getElementById('number'),btn=document.getElementById('play');let last=-1;
function sync(){if(!Number.isFinite(audio.duration)||audio.duration<=0)return;let i=Math.min(8,Math.floor(audio.currentTime/audio.duration*9));if(i!==last){last=i;img.src=base+files[i];cap.textContent=captions[i];num.textContent='Scene '+(i+1)+' of 9';}}
btn.onclick=async()=>{if(audio.paused){try{await audio.play()}catch(e){}}else audio.pause()};
audio.addEventListener('play',()=>btn.textContent='❚❚ PAUSE THE SONG');audio.addEventListener('pause',()=>btn.textContent='▶ PLAY THE CHRISTMAS SONG');audio.addEventListener('ended',()=>{last=-1;sync();btn.textContent='↻ PLAY IT AGAIN'});audio.addEventListener('timeupdate',sync);last=-1;sync();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b35">
  <meta name="description" content="Merry Christmas from everyone at Gellings. Scan, press play and enjoy our Christmas song!">
  <title>Gellings Christmas Song</title>
  <style>
    :root { color-scheme: dark; --navy:#071b35; --teal:#20c9c2; --green:#79bd43; --red:#c92336; --cream:#fff8e9; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#153b61 0%,var(--navy) 65%); color:var(--cream); font-family:Arial,Helvetica,sans-serif; }
    main { width:min(100% - 28px,900px); margin:0 auto; padding:26px 0 42px; text-align:center; }
    .brand { color:var(--teal); font-weight:900; font-size:clamp(28px,6vw,48px); letter-spacing:-1.5px; margin:4px 0 0; }
    .tagline { color:#fff; margin:2px 0 20px; font-size:14px; }
    .poster { display:block; width:100%; height:auto; border:3px solid #d6b85e; border-radius:12px; box-shadow:0 18px 55px #0008; }
    .player { margin:22px auto 0; padding:22px; max-width:620px; background:#102b49; border:1px solid #2a5678; border-radius:14px; box-shadow:0 12px 35px #0005; }
    h1 { margin:0 0 8px; font-size:clamp(23px,4vw,34px); }
    .intro { margin:0 0 18px; color:#d8e7f1; line-height:1.5; }
    button { border:0; border-radius:999px; padding:15px 30px; background:linear-gradient(135deg,var(--green),#a2d65b); color:#09213a; font-weight:900; font-size:17px; cursor:pointer; box-shadow:0 6px 20px #0004; }
    button:hover { filter:brightness(1.08); transform:translateY(-1px); }
    button:focus-visible { outline:3px solid white; outline-offset:4px; }
    audio { display:block; width:100%; margin-top:18px; }
    .note { color:#b8cbd9; font-size:12px; margin:15px 0 0; }
    footer { margin-top:24px; color:#d2e1eb; font-size:13px; }
    footer strong { color:var(--teal); }
  </style>
</head>
<body>
  <main>
    <div class="brand">Gellings</div>
    <div class="tagline">The Happy Hygiene &amp; Hospitality People</div>
    <img class="poster" src="assets/gellings-christmas-team.jpg" alt="Gellings team Christmas caricature">
    <section class="player" aria-label="Christmas song player">
      <h1>🎄 Santa's Ghellings Workshop 🎸</h1>
      <p class="intro">The Gellings Christmas song is here! Turn it up and enjoy the full team anthem.</p>
      <button id="playButton" type="button">▶ PLAY THE CHRISTMAS SONG</button>
      <audio id="song" controls preload="metadata">
        <source src="assets/santas-ghellings-workshop.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
      <p class="note">Tap play to start the full song. Your phone may need the volume turned up.</p>
    </section>
    <footer>Merry Christmas from everyone at <strong>Gellings</strong> ❤️</footer>
  </main>
  <script>
    const audio = document.getElementById('song');
    const button = document.getElementById('playButton');
    button.addEventListener('click', async () => {
      if (audio.paused) {
        try { await audio.play(); button.textContent = '❚❚ PAUSE THE SONG'; }
        catch (_) { button.textContent = '▶ PRESS PLAY IN THE PLAYER BELOW'; }
      } else {
        audio.pause(); button.textContent = '▶ PLAY THE CHRISTMAS SONG';
      }
    });
    audio.addEventListener('play', () => button.textContent = '❚❚ PAUSE THE SONG');
    audio.addEventListener('pause', () => button.textContent = '▶ PLAY THE CHRISTMAS SONG');
    audio.addEventListener('ended', () => button.textContent = '↻ PLAY IT AGAIN');
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b35">
<title>Gellings Christmas Song</title>
<style>
:root{--navy:#071b35;--teal:#20c9c2;--green:#80c342;--cream:#fff8e9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#183b5e,var(--navy) 68%);color:var(--cream);font-family:Arial,sans-serif}
main{max-width:1000px;width:calc(100% - 28px);margin:auto;padding:20px 0 42px;text-align:center}
.brand{font-size:clamp(30px,6vw,48px);font-weight:900;color:var(--teal);letter-spacing:-1px}
.tag{margin:0 0 18px;font-size:14px}
.poster{width:100%;height:auto;border:2px solid #d7b75b;border-radius:12px;box-shadow:0 15px 42px #0008}
.player{margin:22px auto;padding:20px;max-width:700px;background:#102b49;border:1px solid #2a5678;border-radius:14px}
h1{font-size:clamp(23px,4vw,34px);margin:0 0 8px}p{line-height:1.5}
button{border:0;border-radius:999px;padding:14px 24px;background:linear-gradient(135deg,var(--green),#b3e36b);color:#09213a;font-size:16px;font-weight:900;cursor:pointer;margin:5px}
audio{width:100%;display:block;margin-top:14px}
.stage{margin:24px auto 0;max-width:920px}
.stage img{width:100%;display:block;border-radius:12px;border:2px solid #d7b75b;box-shadow:0 16px 40px #0008;aspect-ratio:16/9;object-fit:cover}
.caption{font-weight:800;font-size:clamp(17px,3vw,23px);margin:12px 0 4px}
.small{font-size:12px;color:#bfd0df}
footer{margin-top:24px;font-size:13px;color:#d2e1eb}footer b{color:var(--teal)}
</style></head>
<body><main>
<div class="brand">Gellings</div><div class="tag">The Happy Hygiene &amp; Hospitality People</div>
<img class="poster" src="assets/gellings-team-caricature.jpg" alt="Gellings Christmas team caricature">
<section class="player">
<h1>🎄 Santa's Ghellings Workshop 🎸</h1>
<p>Press play for the full Christmas anthem. The illustrated scenes will change as the song plays.</p>
<button id="play">▶ PLAY THE CHRISTMAS SONG</button>
<audio id="song" controls preload="metadata"><source src="assets/santas-ghellings-workshop.mp3" type="audio/mpeg"></audio>
</section>
<section class="stage" aria-live="polite">
<img id="scene" src="assets/01-north-pole-breaking-news.jpg" alt="Gellings Christmas song scene">
<div class="caption" id="caption">Breaking news from the North Pole!</div>
<div class="small" id="counter">Scene 1 of 9</div>
<div><button id="prev">← PREVIOUS</button><button id="next">NEXT →</button></div>
</section>
<footer>Merry Christmas from everyone at <b>Gellings</b> ❤️</footer>
</main>
<script>
const scenes=["assets/01-north-pole-breaking-news.jpg","assets/02-santa-calls-gellings.jpg","assets/03-office-and-orders-chaos.jpg","assets/04-dave-and-daz-island-deliveries.jpg","assets/05-john-parking-problem.jpg","assets/06-colin-and-the-mince-pies.jpg","assets/07-glynis-clocked-off.jpg","assets/08-gellings-team-chorus.jpg","assets/09-grand-christmas-finale.jpg"];
const captions=["Breaking news from the North Pole!","Santa calls Gellings for help","Orders, presents and paperwork everywhere","Dave and Daz race round the island","John's got nowhere left to park","Colin's found the mince pies","Glynis has clocked off for Christmas","The Gellings team bring the chorus","Santa's sorted — Merry Christmas!"];
const audio=document.getElementById('song'), img=document.getElementById('scene'), cap=document.getElementById('caption'), counter=document.getElementById('counter'), play=document.getElementById('play');
let index=0, timer=null;
function show(i){index=(i+scenes.length)%scenes.length;img.src=scenes[index];cap.textContent=captions[index];counter.textContent=`Scene ${index+1} of ${scenes.length}`;}
function startSlides(){if(timer)clearInterval(timer);show(Math.floor((audio.currentTime/Math.max(audio.duration||122,122))*scenes.length));timer=setInterval(()=>{if(!audio.paused)show(Math.floor((audio.currentTime/Math.max(audio.duration||122,122))*scenes.length));},800);}
play.addEventListener('click',async()=>{if(audio.paused){try{await audio.play();play.textContent='❚❚ PAUSE SONG';startSlides();}catch(e){play.textContent='PRESS PLAY IN THE AUDIO PLAYER';}}else{audio.pause();play.textContent='▶ PLAY THE CHRISTMAS SONG';}});
audio.addEventListener('play',startSlides);audio.addEventListener('pause',()=>{play.textContent='▶ PLAY THE CHRISTMAS SONG';});
audio.addEventListener('ended',()=>{if(timer)clearInterval(timer);show(8);play.textContent='↻ PLAY IT AGAIN';});
document.getElementById('prev').addEventListener('click',()=>show(index-1));
document.getElementById('next').addEventListener('click',()=>show(index+1));
</script></body></html>
